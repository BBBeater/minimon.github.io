<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>มอนสเตอร์ขนมหวาน</title>
<meta name="description" content="เกมการ์ดสุ่มสะสมมอนสเตอร์ 8 ธาตุ เล่นกับบอทหรือเพื่อนออนไลน์">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff8fb;--ink:#4a3f55;--card:#fff;--line:#eadcf0;--btn:#d9c7ff;--pink:#ff7aa8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#241f2d;--ink:#f1e9f7;--card:#352e40;--line:#4d4259;--btn:#7b63b8}}
:root[data-theme="dark"]{--bg:#241f2d;--ink:#f1e9f7;--card:#352e40;--line:#4d4259;--btn:#7b63b8}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Sarabun","Noto Sans Thai",system-ui,sans-serif}
main{max-width:680px;margin:0 auto;padding:0 12px 24px}
h1{font-size:20px;margin:8px 0 0;text-align:center}
.top{position:sticky;top:0;z-index:6;display:flex;justify-content:space-between;align-items:center;background:var(--bg);padding:8px 2px;margin-bottom:8px;border-bottom:2px solid var(--line)}
.coin{font-weight:800;font-size:18px;display:inline-block}
.box{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}
input,textarea{font:inherit;padding:9px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);width:100%;margin:4px 0}
textarea{font-size:11px;resize:none}
button{font:inherit;font-weight:700;padding:9px 14px;border:0;border-radius:14px;background:var(--btn);color:var(--ink);cursor:pointer;transition:transform .1s}
button:active{transform:scale(.95)}button:disabled{opacity:.45;cursor:default}
button.sm{padding:5px 10px}button.on{outline:3px solid var(--pink)}button.go{background:#ff9fb8;color:#3a3045;font-size:16px;padding:10px 18px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.nav{display:flex;gap:6px;margin-bottom:10px}.nav button{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.card{position:relative;border-radius:12px;border:2px solid #b9b2c4;padding:15px 3px 4px;text-align:center;font-size:11px;line-height:1.2;color:#3a3045;user-select:none;background:var(--t,#fff)}
.card .em{font-size:30px;line-height:1.3}

.card .p{top:3px;left:3px;width:22px;height:22px;background:#ff6b8b;color:#fff;font-weight:800;font-size:13px;box-shadow:0 1px 2px #0003}
.card .ab{top:3px;right:3px;width:22px;height:22px;background:#fff;font-size:13px;box-shadow:0 1px 2px #0003}
.card .el{bottom:-7px;left:-6px;width:22px;height:22px;background:#fff;border:2px solid var(--line);font-size:12px}
.card .rt{position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:8px;font-weight:800;letter-spacing:.5px;border-radius:8px;padding:0 6px;font-style:normal;white-space:nowrap}
.card .rt.R{background:#3b8df0;color:#fff}.card .rt.E{background:#a24bff;color:#fff}.card .rt.L{background:linear-gradient(90deg,#ffb300,#ff6f3c);color:#3a1d00}
.card .cs{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);font-style:normal;font-size:9px;background:#4a3f55;color:#fff;border-radius:8px;padding:0 6px;white-space:nowrap}
.card .n{position:absolute;bottom:-7px;right:-6px;font-size:10px;background:#ff5c8a;color:#fff;border-radius:8px;padding:0 5px}
.card.C{border-color:#b9b2c4}
.card.R{border:3px solid #3b8df0;box-shadow:inset 0 0 0 1px #d6e8ff,0 0 8px #3b8df0aa}
.card.E{border:3px solid #a24bff;box-shadow:inset 0 0 0 1px #ecd6ff,0 0 12px #a24bffcc}
.card.L{border:3px solid transparent;background:linear-gradient(var(--t),var(--t)) padding-box,linear-gradient(135deg,#ffd54a,#ff8a3c,#fff0b0,#ffb300,#ffd54a) border-box;box-shadow:0 0 16px #ffb300cc;animation:lglow 2.2s infinite}
.card.pick,.card.add{cursor:pointer}.card.pick:hover{transform:translateY(-4px)}
.card.sel{outline:3px solid var(--pink);animation:lift .18s forwards}
.card.dim{opacity:.35;filter:grayscale(1)}
.card.nw::after{content:"NEW";position:absolute;top:-7px;right:-5px;background:#ff5c8a;color:#fff;border-radius:8px;font-size:9px;padding:0 5px;font-weight:800}
.card .p.up{background:#17a34a}.card .p.up::after{content:"▲";font-size:7px;position:absolute;bottom:-5px;color:#17a34a}
.hand{display:flex;gap:8px;overflow-x:auto;padding:12px 4px 8px}.hand .card{width:76px;flex:0 0 auto}
.bar{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:8px 12px;margin-bottom:8px}
.pl.r{text-align:right}.pips{letter-spacing:3px;color:var(--pink);font-size:18px}.mid{font-weight:800;text-align:center}
.field{background:linear-gradient(var(--card),var(--bg));border:2px dashed var(--line);border-radius:18px;padding:8px;display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.col{display:flex;flex-direction:column;gap:4px;align-items:center}.col .card,.slot,.cback,.ar{width:100%;max-width:84px}
.slot,.cback{min-height:66px;border:2px dashed var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;opacity:.6;font-size:18px;text-align:center}
.slot.now{border-color:var(--pink);opacity:1;font-size:12px}
.cback{border-style:solid;opacity:1;font-size:26px;background:repeating-linear-gradient(45deg,#d9c7ff,#d9c7ff 6px,#f3e9ff 6px,#f3e9ff 12px);animation:float 1.4s infinite}
.ar{text-align:center;font-size:20px;line-height:1.1;border-radius:10px;opacity:.75}.ar small{display:block;font-size:11px}
.ar.now{opacity:1;background:#ffe9a8;color:#3a3045;animation:float 1.4s infinite}
.res{font-size:18px;min-height:24px}
.vs{display:flex;align-items:center;justify-content:center;gap:12px;margin:14px 0 10px;position:relative}
.side{position:relative}
.frag{display:none;position:absolute;left:50%;top:50%;width:12px;height:12px;border-radius:3px;background:var(--t,#ffd54a);opacity:0}
.vs.an .frag{display:block;animation:fly .9s 1s forwards}
.burst{position:absolute;left:50%;top:45%;font-size:46px;transform:translate(-50%,-50%) scale(0);opacity:0;pointer-events:none;animation:burst .5s .55s both}
.vs.an .side.L{animation:clL 1.5s both}.vs.an .side.R{animation:clR 1.5s both}
.vs.an .side.dead .card{animation:shatter .9s 1s both}
.vs.an .side.alive .card{animation:vict .9s 1s both}
.vs.an .side.tie .card{animation:bounce .5s 1s both}
.side.dead .card{opacity:.22;filter:grayscale(1)}
.late{animation:pop .4s 1.7s both}
.chip{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:1px 7px;margin:2px;font-size:12px}
.chip.g{background:#d6f5dc;color:#1c5a2a;border-color:#a9dfb5}
.bk{margin:6px 0;line-height:1.9}
.fe{font-size:20px}
.vs .card,.vs .slot,.vs .cback{width:108px;max-width:none;min-height:128px}.vs .card .em{font-size:46px}.vs .card{font-size:12px}
.vsx{font-size:26px}
.trk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:8px}
.trk div{text-align:center;border:2px solid var(--line);border-radius:10px;font-size:15px;padding:2px 0;background:var(--card);line-height:1.25}
.trk .now{border-color:var(--pink);background:#ffe9a8;color:#3a3045}
.big{font-size:19px;text-align:center;margin:8px 0}
.cbar{position:sticky;bottom:8px;z-index:5;background:var(--card);border:2px solid var(--pink);border-radius:16px;padding:10px;margin-top:6px;display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap;animation:pop .2s}
.arena{border-color:#f2b84b;text-align:center;padding:8px}
.wheel{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:300px;margin:8px auto}
.wc,.wmid{border-radius:14px;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:22px;padding:4px;color:#3a3045;background:var(--bg);border:2px solid var(--line)}
.wc small,.wmid small{font-size:11px}.wc.w{background:#c9f2cf}.wc.l{background:#ffd0d6}.wc.self{outline:3px solid var(--pink);background:#fff3b8}
.wmid{border:0;text-align:center;color:var(--ink)}
.lg{display:grid;grid-template-columns:1fr 1fr;gap:4px;font-size:12px}
.reward{font-size:28px;font-weight:800;animation:pop .6s .3s both}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#4a3f55;color:#fff;padding:10px 16px;border-radius:20px;opacity:0;transition:.25s;pointer-events:none;z-index:20;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:10}
.confetti i{position:absolute;top:-30px;font-style:normal;font-size:24px;animation:fall 3s linear forwards}
small{opacity:.85}.chips button{padding:5px 9px;font-size:13px}
@keyframes lglow{50%{box-shadow:0 0 22px #ffd54acc}}
@keyframes clL{0%{transform:translateX(-110px) scale(.9);opacity:0}22%{transform:translateX(-14px);opacity:1}40%{transform:translateX(46px) scale(1.1)}50%{transform:translateX(30px)}64%{transform:translateX(4px)}100%{transform:none}}
@keyframes clR{0%{transform:translateX(110px) scale(.9);opacity:0}22%{transform:translateX(14px);opacity:1}40%{transform:translateX(-46px) scale(1.1)}50%{transform:translateX(-30px)}64%{transform:translateX(-4px)}100%{transform:none}}
@keyframes burst{0%{transform:translate(-50%,-50%) scale(0);opacity:1}60%{transform:translate(-50%,-50%) scale(1.5);opacity:1}100%{transform:translate(-50%,-50%) scale(2);opacity:0}}
@keyframes shatter{0%{opacity:1;filter:none;transform:none}25%{transform:scale(1.06) rotate(3deg);filter:brightness(1.8)}100%{opacity:.22;filter:grayscale(1) blur(1px);transform:scale(.78) rotate(-9deg) translateY(10px)}}
@keyframes fly{0%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.2) rotate(var(--r))}}
@keyframes vict{50%{transform:scale(1.14);box-shadow:0 0 24px 6px #ffd54a}100%{transform:scale(1.05)}}
@keyframes bounce{40%{transform:translateY(-10px)}100%{transform:none}}
@keyframes deal{from{opacity:0;transform:translateY(50px) scale(.8) rotate(-8deg)}to{opacity:1;transform:none}}
@keyframes flip{0%{transform:perspective(400px) rotateY(90deg);opacity:0}100%{transform:perspective(400px) rotateY(0);opacity:1}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.07)}100%{transform:scale(1);opacity:1}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes glow{50%{box-shadow:0 0 18px 5px #ffd54a}}
@keyframes lift{to{transform:translateY(-8px)}}
@keyframes float{50%{transform:translateY(-4px)}}
@keyframes bump{50%{transform:scale(1.35)}}
@keyframes fall{to{transform:translateY(110vh) rotate(400deg)}}
.deal{animation:deal .45s both;animation-delay:var(--d,0s)}
.flip{animation:flip .55s both;animation-delay:var(--d,0s)}
.win{animation:glow 1s 2}.lose{animation:shake .4s;opacity:.7}.pop{animation:pop .4s both}.bump{animation:bump .45s}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>

 a.innerHTML=h;
 if(st.tab==="pack")st.packAnim=false;
 st.coinBump=0;
 if(st.msg){toast(st.msg);st.msg=""}}
// ---- อีเวนต์
let ct=null;
document.addEventListener("input",e=>{const i=e.target.id;if(i==="nm")st.nm=e.target.value;
 if(i==="cin"){st.cin=e.target.value;clearTimeout(ct);ct=setTimeout(()=>{if(st.cin.length>80){
  if(st.p2p==="host"&&pc&&st.conn!=="connecting"&&st.conn!=="open")p2pGo();else if(st.p2p==="guest"&&!st.out)p2pAns()}},400)}});
document.addEventListener("click",e=>{
 const t=e.target.closest("[data-tab],[data-act],[data-flt],[data-wv],.card");if(!t)return;
 const act=t.dataset.act;
 if(act==="snd"){S.snd=!S.snd;sv();if(S.snd)snd("pick");return R()}
 if(act==="help"){st.help=!st.help;return R()}
 if(t.dataset.tab){st.tab=t.dataset.tab;return R()}
 if(t.dataset.flt){st.flt=t.dataset.flt;return R()}
 if(t.dataset.wv){st.wv=t.dataset.wv;return R()}
 if(act==="home")return location.reload();
 if(act==="copylink")return copy(link());
 if(act==="copycode")return copy(st.out);
 if(act==="copyfull")return copy(st.full||st.out);
 if(st.tab==="game"){
  if(act==="next"){st.ack++;st.sel=-1;return R()}
  if(act==="again"){if(bot)startBot();else{st.rm=true;send({t:"rm"});toast("รอเพื่อน…");checkRm()}return}
  if(t.classList.contains("pick")&&t.dataset.i!==undefined){st.sel=+t.dataset.i;snd("pick");return R()}
  if(act==="unsel"){st.sel=-1;return R()}
  if(act==="play"&&st.sel>=0){mine.picks.push(mine.hand.splice(st.sel,1)[0]);st.sel=-1;snd("play");save();return R()}
  return}
 if(act==="bot")return startBot();
 if(act==="p2phost")return p2pHost();
 if(act==="p2pguest"){st.p2p="guest";st.out="";st.cin="";st.conn="";return R()}
 if(act==="p2pcancel")return p2pCancel();
if(act==="open"&&S.coins>=PACK){const had=new Set(Object.keys(S.inv));S.coins-=PACK;const p=openPack();p.sort((a,b)=>TIERS.indexOf(C[a].r)-TIERS.indexOf(C[b].r)||C[a].p-C[b].p);st.pack=p;st.dv=null;st.packAnim=true;st.newIds=p.filter(i=>!had.has(String(i)));st.coinBump=1;snd("coin");
  (st.tm||[]).forEach(clearTimeout);st.tm=p.map((id,k)=>setTimeout(()=>snd(C[id].r==="L"?"legend":C[id].r==="E"||C[id].r==="R"?"rare":"flip"),380+k*400));return R()}
 if(act==="skip"){(st.tm||[]).forEach(clearTimeout);st.packAnim=false;return R()}
 if(act==="dvx"){st.dv=null;return R()}
 if(act==="dvadd"){if(st.dv&&canAdd(st.dv.id)){S.deck.push(st.dv.id);sv();snd("pick")}return R()}
 if(act==="dvrm"){if(st.dv){const k=S.deck.indexOf(st.dv.id);if(k>=0)S.deck.splice(k,1);sv()}st.dv=null;return R()}
 if(t.classList.contains("card")&&t.dataset.src&&t.dataset.id!==undefined){st.dv={id:+t.dataset.id,src:t.dataset.src};snd("pick");return R()}
 if(act==="usepack"){S.deck=build(st.pack);sv();st.msg=S.deck.length===10?"✅ ตั้งเป็นเด็คแล้ว พร้อมเล่น":"⚠️ ไปจัดเด็คต่ออีกนิด";st.tab="play";return R()}
 if(act==="clr"){S.deck=[];sv();return R()}
if(act==="best"){S.deck=build([]);sv();st.dv=null;st.msg="🏆 จัดเด็คแรงสุดจากการ์ดที่มีให้แล้ว";return R()}
 if(act==="auto"){const key=d=>[...d].sort((a,b)=>a-b).join(),cur=key(S.deck);let best=null,th=[];
  for(let t=0;t<12;t++){const r=buildR();if(r.d.length===10){best=r.d;th=r.th;if(key(r.d)!==cur)break}}
  if(best){const same=key(best)===cur;S.deck=best;sv();st.dv=null;st.msg=same?"การ์ดในสมุดมีน้อย จัดได้แบบเดียว ลองเปิดซองเพิ่ม":`🎲 จัดแนว ${th.map(e=>EM[e]).join("")} ให้แล้ว (กดอีกครั้งจะได้เด็คใหม่)`}
  else{S.deck=build([]);sv()}return R()}
});
R();
const hm=location.hash.match(/^#j=(.+)/);
if(hm){st.p2p="guest";st.cin=hm[1];R();p2pAns()}
</script></body></html>
