<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>มอนสเตอร์ขนมหวาน</title>
<meta name="description" content="เกมการ์ดสุ่มสะสมมอนสเตอร์ 8 ธาตุ เล่นกับบอทหรือเพื่อนออนไลน์">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff8fb;--ink:#4a3f55;--card:#fff;--line:#eadcf0;--btn:#d9c7ff;--pink:#ff7aa8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#241f2d;--ink:#f1e9f7;--card:#352e40;--line:#4d4259;--btn:#7b63b8}}
:root[data-theme="dark"]{--bg:#241f2d;--ink:#f1e9f7;--card:#352e40;--line:#4d4259;--btn:#7b63b8}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Sarabun","Noto Sans Thai",system-ui,sans-serif}
main{max-width:680px;margin:0 auto;padding:0 12px 24px}
h1{font-size:21px;margin:10px 0 0;text-align:center}
.top{position:sticky;top:0;z-index:6;display:flex;justify-content:space-between;align-items:center;background:var(--bg);padding:8px 2px;margin-bottom:8px;border-bottom:2px solid var(--line)}
.coin{font-weight:800;font-size:18px;display:inline-block}
.box{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}
input,textarea{font:inherit;padding:9px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);width:100%;margin:4px 0}
textarea{font-size:11px;resize:none}
button{font:inherit;font-weight:700;padding:9px 14px;border:0;border-radius:14px;background:var(--btn);color:var(--ink);cursor:pointer;transition:transform .1s}
button:active{transform:scale(.95)}button:disabled{opacity:.45;cursor:default}
button.sm{padding:5px 10px}button.on{outline:3px solid var(--pink)}button.go{background:#ff9fb8;color:#3a3045;font-size:16px;padding:10px 18px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.nav{display:flex;gap:6px;margin-bottom:10px}.nav button{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.card{position:relative;border-radius:12px;border:2px solid var(--line);padding:3px;text-align:center;font-size:11px;line-height:1.2;color:#3a3045;user-select:none}
.card .em{font-size:30px;line-height:1.3}
.card b{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.card .p{position:absolute;top:1px;left:4px;font-weight:800;font-size:14px;font-style:normal}
.card .ab{position:absolute;top:1px;right:3px;font-style:normal;font-size:12px}
.card .n{position:absolute;bottom:1px;right:3px;font-size:10px;background:#4a3f55;color:#fff;border-radius:8px;padding:0 5px}
.card.R{border-color:#f2b84b}.card.L{border-color:#c46bff;box-shadow:0 0 8px #c46bff99}
.card.pick,.card.add{cursor:pointer}.card.pick:hover{transform:translateY(-4px)}
.card.sel{outline:3px solid var(--pink);animation:lift .18s forwards}
.card.dim{opacity:.35;filter:grayscale(1)}
.card.nw::after{content:"NEW";position:absolute;top:-7px;right:-5px;background:#ff5c8a;color:#fff;border-radius:8px;font-size:9px;padding:0 5px;font-weight:800}
.hand{display:flex;gap:8px;overflow-x:auto;padding:12px 4px 8px}.hand .card{width:76px;flex:0 0 auto}
.bar{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:8px 12px;margin-bottom:8px}
.pl.r{text-align:right}.pips{letter-spacing:3px;color:var(--pink);font-size:18px}.mid{font-weight:800;text-align:center}
.field{background:linear-gradient(var(--card),var(--bg));border:2px dashed var(--line);border-radius:18px;padding:8px;display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.col{display:flex;flex-direction:column;gap:4px;align-items:center}.col .card,.slot,.cback{width:100%;max-width:84px}
.slot,.cback{min-height:66px;border:2px dashed var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;opacity:.6;font-size:18px;text-align:center}
.slot.now{border-color:var(--pink);opacity:1;font-size:12px}
.cback{border-style:solid;opacity:1;font-size:26px;background:repeating-linear-gradient(45deg,#d9c7ff,#d9c7ff 6px,#f3e9ff 6px,#f3e9ff 12px);animation:float 1.4s infinite}
.res{font-size:18px;min-height:24px}
.big{font-size:19px;text-align:center;margin:8px 0}
.cbar{position:sticky;bottom:8px;z-index:5;background:var(--card);border:2px solid var(--pink);border-radius:16px;padding:10px;margin-top:6px;display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap;animation:pop .2s}
.warn{border-color:var(--pink)}.steps{padding-left:18px;margin:6px 0}.steps li{margin-bottom:8px}
.reward{font-size:28px;font-weight:800;animation:pop .6s .3s both}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#4a3f55;color:#fff;padding:10px 16px;border-radius:20px;opacity:0;transition:.25s;pointer-events:none;z-index:20;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:10}
.confetti i{position:absolute;top:-30px;font-style:normal;font-size:24px;animation:fall 3s linear forwards}
small{opacity:.85}.chips button{padding:5px 9px;font-size:13px}
@keyframes deal{from{opacity:0;transform:translateY(50px) scale(.8) rotate(-8deg)}to{opacity:1;transform:none}}
@keyframes flip{0%{transform:perspective(400px) rotateY(90deg);opacity:0}100%{transform:perspective(400px) rotateY(0);opacity:1}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.07)}100%{transform:scale(1);opacity:1}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes glow{50%{box-shadow:0 0 18px 5px #ffd54a}}
@keyframes lift{to{transform:translateY(-8px)}}
@keyframes float{50%{transform:translateY(-4px)}}
@keyframes bump{50%{transform:scale(1.35)}}
@keyframes fall{to{transform:translateY(110vh) rotate(400deg)}}
.deal{animation:deal .45s both;animation-delay:var(--d,0s)}
.flip{animation:flip .55s both;animation-delay:var(--d,0s)}
.win{animation:glow 1s 2}.lose{animation:shake .4s;opacity:.7}.pop{animation:pop .4s both}.bump{animation:bump .45s}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body><main>
<h1>🍮 มอนสเตอร์ขนมหวาน 🍓</h1>
<div id="app"></div>
</main>
<div id="toast" class="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const EK=["fire","water","leaf","elec","earth","ice","wind","dark"];
const EM={fire:"🔥",water:"💧",leaf:"🌿",elec:"⚡",earth:"⛰️",ice:"❄️",wind:"💨",dark:"🌑"};
const EN={fire:"ไฟ",water:"น้ำ",leaf:"ใบไม้",elec:"ไฟฟ้า",earth:"ดิน",ice:"น้ำแข็ง",wind:"ลม",dark:"เงา"};
const TINT={fire:"#ffd3c6",water:"#cbe8ff",leaf:"#d3f2d4",elec:"#fff3b8",earth:"#e8d8c4",ice:"#dff6ff",wind:"#e0f5ec",dark:"#d9d0e8"};
// แต่ละธาตุชนะ 3 แพ้ 3 เสมอ 1
const BEAT={fire:["leaf","ice","dark"],water:["fire","earth","wind"],leaf:["water","earth","elec"],elec:["water","ice","dark"],earth:["fire","elec","dark"],ice:["water","leaf","wind"],wind:["fire","elec","earth"],dark:["ice","leaf","wind"]};
const WHY={fire:"เผาไหม้ / ละลายน้ำแข็ง / แสงไฟไล่เงา",water:"ดับไฟ / กัดเซาะดิน / ฝนกดลมสงบ",leaf:"ดูดซับน้ำ / รากชอนไชดิน / ไม้เป็นฉนวน",elec:"ช็อตผ่านน้ำ / ความร้อนละลายน้ำแข็ง / แสงไล่เงา",earth:"ทับไฟ / สายดินดูดไฟฟ้า / หินแข็งกว่าเงา",ice:"แช่แข็งน้ำ / แช่แข็งใบไม้ / แช่แข็งสายลม",wind:"พัดไฟดับ / กระชากสายไฟ / กัดเซาะหิน",dark:"กลืนความเย็น / บังแสงใบไม้ / ซ่อนจากลม"};
const AB={s:["🛡️","โล่","ไม่โดนโบนัสธาตุของคู่ต่อสู้"],x:["⚔️","เจาะธาตุ","ชนะทางธาตุได้ +4 แทน +2"],l:["🍀","โชคดี","ชนะรอบนี้ จั่วเพิ่ม 2 ใบ"],t:["🎯","คู่ขาด","พลังเท่ากัน = ชนะ"],n:["🌀","ล้างธาตุ","ยกเลิกโบนัสธาตุทั้งสองฝั่ง"],r:["💰","รวย","ชนะรอบนี้ ได้ 🪙+10"],k:["🔇","ปิดผนึก","ยกเลิกความสามารถของการ์ดคู่ต่อสู้ในรอบนี้ (ถ้าปิดผนึกทั้งคู่ ต่างฝ่ายต่างถูกปิด)"],g:["💪","สู้คืน","ถ้าแต้มตามอยู่ ได้พลัง +2"]};
const RN={C:"ธรรมดา",R:"หายาก",L:"ตำนาน"};
// รายชื่อ: C(ที่เหลือ) + R 4 + L 2 ต่อธาตุ · pattern: ตัวอักษรความสามารถ (s,x,l,t,n,r,k,g) หรือ - = ไม่มี
const D={
fire:["🦊จิ้งจอกถ่าน,🐯เสือเตา,🦎กิ้งก่าไฟ,🐓ไก่เพลิง,🐕หมาเถ้า,🐒ลิงควัน,🐖หมูย่าง,🦁สิงห์ลาวา,🐂วัวเพลิง,🐎ม้าเปลวเพลิง,🦂แมงป่องร้อน,🐉มังกรแดง,🦖ไดโนภูเขาไฟ","-r-gs--x-lkxn"],
water:["🐟ปลาฟอง,🐢เต่าธาร,🦀ปูกรรไกร,🐸กบฝน,🦐กุ้งจิ๋ว,🐠ปลาการ์ตูน,🦆เป็ดบึง,🐙หมึกยักษ์,🦈ฉลามคลื่น,🐬โลมาเกลียวคลื่น,🦦นากธาร,🐋วาฬคลื่น,🦑หมึกพายุ","--s-kr-t-x-sl"],
leaf:["🐛หนอนใบ,🐰กระต่ายหญ้า,🐌หอยทากมอส,🦗จิ้งหรีดใบ,🐞เต่าทองดอก,🦋ผีเสื้อละออง,🐹แฮมสเตอร์ถั่ว,🦌กวางป่า,🦥สลอธมอส,🦘จิงโจ้เถาวัลย์,🐼แพนด้าไผ่,🦕ไดโนป่า,🦧ลิงผู้พิทักษ์","-l--rgn-s-tlx"],
elec:["🐝ผึ้งสปาร์ก,🐭หนูแรงดัน,🦇ค้างคาวคลื่น,🐈แมวไฟสถิต,🦔เม่นประจุ,🦟ยุงช็อต,🐤เจี๊ยบไฟช็อต,🦅นกฟ้าผ่า,🐺หมาป่าสายฟ้า,🦓ม้าลายเส้นไฟ,🦒ยีราฟล่อฟ้า,🦄ยูนิคอร์นสายฟ้า,🐲มังกรพายุ","--t-ks-x-l-nx"],
earth:["🐜มดดิน,🐗หมูป่าหิน,🦎กิ้งก่าโคลน,🦡แบดเจอร์ถ้ำ,🐀หนูขุดดิน,🐪อูฐทราย,🦏แรดผา,🐃ควายนา,🐄วัวผา,🐻หมีถ้ำ,🐘ช้างภูเขา,🐫อูฐเทพทะเลทราย","-s--rgt-x-sl"],
ice:["🐧เพนกวินจิ๋ว,🐇กระต่ายหิมะ,🦢หงส์ผลึก,🐑แกะขนฝอย,🐐แพะหน้าผา,🦉นกฮูกน้ำค้าง,🐩พุดเดิ้ลน้ำค้างแข็ง,🦙ลามะขนเยือก,🦃ไก่งวงเหมันต์,🦛ฮิปโปเยือก,🐳วาฬน้ำแข็ง,🐊จระเข้เหมันต์","--n-s-gk-x-t"],
wind:["🐦นกจิ๊บลม,🦜นกแก้วพายุ,🐥เจี๊ยบกระโชก,🦩ฟลามิงโกเหินลม,🐴ม้าน้อยลม,🐔ไก่ลมหมุน,🐆เสือดาวพายุ,🐅เสือลมกรด,🕊️นกพิราบสายลม,🐿️กระรอกร่อน,🦅อินทรีทะเลทราย,🦚นกยูงเฮอริเคน","-x--l-sg-t-n"],
dark:["🕷️แมงมุมเงา,🐍งูราตรี,🦇ค้างคาวมืด,🐀หนูท่อ,🦉นกฮูกราตรี,🦂แมงป่องดำ,🐺หมาป่าเงา,🦝แรคคูนจอมขโมย,🐈แมวดำ,🦨สกั๊งค์หมอกดำ,👻ผีเงาเฒ่า,😈จ้าวมืด","-k--r-gn-l-x"]};
const PC=[2,3,3,4,2,3,4],PR=[4,5,5,6],PL=[7,8];
const C=[];
EK.forEach(e=>{const L=D[e][0].split(","),pat=D[e][1],nc=L.length-6;
 L.forEach((s,k)=>{const m=s.match(/^\P{L}+/u)[0],r=k<nc?"C":k<nc+4?"R":"L",a=pat[k]==="-"?"":pat[k];
  let p=r==="C"?PC[k]:r==="R"?PR[k-nc]:PL[k-nc-4];if(a&&r!=="L")p=Math.max(1,p-1);
  C.push({id:C.length,m,n:s.slice(m.length),e,r,p,a})})});
// ตัดสิน 1 รอบ (มุมมองของ a) · sa/sb = แต้มสะสมก่อนรอบนี้
function duel(a,b,sa=0,sb=0){const A=C[a],B=C[b];let ea=A.a,eb=B.a;
 if(ea==="k"&&eb==="k")ea=eb="";else if(ea==="k")eb="";else if(eb==="k")ea="";
 let x=A.p,y=B.p,bx=0,by=0,gx=0,gy=0;
 if(ea!=="n"&&eb!=="n"){if(BEAT[A.e].includes(B.e)&&eb!=="s")bx=ea==="x"?4:2;if(BEAT[B.e].includes(A.e)&&ea!=="s")by=eb==="x"?4:2}
 if(ea==="g"&&sa<sb)gx=2;if(eb==="g"&&sb<sa)gy=2;
 x+=bx+gx;y+=by+gy;
 const w=x>y?1:y>x?-1:(ea==="t"&&eb!=="t"?1:eb==="t"&&ea!=="t"?-1:0);
 return{x,y,w,bx,by,gx,gy,ea,eb}}
function rounds(P,Q){const d=Math.min(P.picks.length,Q.picks.length),o=[];let sp=0,sq=0;
 for(let i=0;i<d;i++){const r=duel(P.picks[i],Q.picks[i],sp,sq);o.push(r);if(r.w>0)sp++;else if(r.w<0)sq++}return o}
// ---- ข้อมูลผู้เล่น
let S={coins:100,inv:{},deck:[],snd:true,seen:false};
try{Object.assign(S,JSON.parse(localStorage.getItem("mc2")||"{}"))}catch(e){}
const sv=()=>{try{localStorage.setItem("mc2",JSON.stringify(S))}catch(e){}};
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function one(g){const r=Math.random();let t=r<.7?"C":r<.95?"R":"L";if(g&&t==="C")t=Math.random()<.85?"R":"L";return rnd(C.filter(c=>c.r===t)).id}
const ten=()=>[...Array(10)].map((_,i)=>one(i===9));
function openPack(){const p=ten();p.forEach(i=>S.inv[i]=(S.inv[i]||0)+1);sv();return p}
let st={tab:"play",nm:"",flt:"all",pack:null,newIds:[],packAnim:false,sel:-1,msg:"",help:"",view:-1,p2p:"",out:"",cin:"",conn:"",busy:0,tut:false,flipDone:0,dealt:false,confDone:0,rm:false,orm:false,coinBump:0};
const dcnt=id=>S.deck.filter(x=>x===id).length;
const PACK=100,BUD=18,CST={C:1,R:2,L:3},MAXC=3;
const dcost=d=>d.reduce((t,i)=>t+CST[C[i].r],0);
const canAdd=(id,d=S.deck)=>d.length<10&&d.filter(x=>x===id).length<Math.min(MAXC,S.inv[id]||0)&&dcost(d)+CST[C[id].r]+(9-d.length)<=BUD;
const deckOk=()=>S.deck.length===10&&dcost(S.deck)<=BUD&&S.deck.every(i=>dcnt(i)<=Math.min(MAXC,S.inv[i]||0));
function build(pref){const pool=[];Object.entries(S.inv).forEach(([i,n])=>{for(let k=0;k<n;k++)pool.push(+i)});
 const key=i=>(pref.includes(i)?1000:0)+C[i].p,d=[];
 pool.sort((a,b)=>key(b)-key(a)||b-a).forEach(i=>{if(canAdd(i,d))d.push(i)});return d}
if(!Object.keys(S.inv).length){let p;do{S.inv={};p=openPack();S.deck=build(p)}while(!deckOk());sv();st.msg="🎁 ได้ซองต้อนรับฟรี 10 ใบ ใช้เป็นเด็คเริ่มต้นให้แล้ว!"}
// ---- เสียง / แจ้งเตือน
let AC=null;
function snd(k){if(!S.snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();
 const T={pick:[[660,.06]],play:[[440,.08],[660,.1]],flip:[[520,.07]],win:[[523,.1],[659,.1],[784,.2]],lose:[[330,.12],[247,.22]],rare:[[660,.08],[880,.12]],legend:[[523,.08],[659,.08],[784,.08],[1047,.28]],coin:[[988,.06],[1319,.12]]}[k]||[];
 let t=AC.currentTime;T.forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type="triangle";o.frequency.value=f;g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);t+=d*.9})}catch(e){}}
function toast(t){const e=$("#toast");if(!e)return;e.textContent=t;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),2800)}
function fb(t){const x=document.createElement("textarea");x.value=t;document.body.appendChild(x);x.select();try{document.execCommand("copy");toast("คัดลอกแล้ว ✅")}catch(e){toast("คัดลอกไม่ได้ ลองกดค้างที่ข้อความ")}x.remove()}
function copy(t){try{navigator.clipboard.writeText(t).then(()=>toast("คัดลอกแล้ว ✅"),()=>fb(t))}catch(e){fb(t)}}
// ---- การ์ด
function cardH(id,x="",n=0,d=0,ex=""){const c=C[id];return `<div class="card ${c.r} ${x}" style="background:${TINT[c.e]};--d:${d}s" data-id="${id}" ${ex} title="${c.n}"><i class="p">${c.p}</i>${c.a?`<i class="ab">${AB[c.a][0]}</i>`:""}<div class="em">${c.m}</div><b>${EM[c.e]}${c.n}</b>${n?`<span class="n">×${n}</span>`:""}</div>`}
function info(id){const c=C[id],b=BEAT[c.e];return `<b>${c.m} ${c.n}</b> · ${EM[c.e]}${EN[c.e]} · ${RN[c.r]} · พลัง ${c.p}${c.a?`<br>${AB[c.a][0]} <b>${AB[c.a][1]}</b>: ${AB[c.a][2]}`:""}<br><small>ชนะ ${b.map(x=>EM[x]).join("")} · แพ้ ${EK.filter(k=>BEAT[k].includes(c.e)).map(x=>EM[x]).join("")}</small>`}
// ---- แมตช์

const ICE={iceServers:[{urls:"stun:stun.l.google.com:19302"},{urls:"stun:stun.cloudflare.com:3478"}]};
const b64=u=>btoa(String.fromCharCode(...u)).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const ub64=s=>Uint8Array.from(atob(s.replace(/-/g,"+").replace(/_/g,"/")),c=>c.charCodeAt(0));
async function zip(str){const u=new TextEncoder().encode(str);
 if(window.CompressionStream)return "z"+b64(new Uint8Array(await new Response(new Blob([u]).stream().pipeThrough(new CompressionStream("deflate-raw"))).arrayBuffer()));
 return "p"+b64(u)}
async function unzip(c){c=c.trim();if(c.includes("j="))c=c.split("j=").pop();c=c.replace(/\s/g,"");const u=ub64(c.slice(1));
 if(c[0]==="z")return new TextDecoder().decode(await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer());
 return new TextDecoder().decode(u)}
const gathered=c=>new Promise(r=>{if(c.iceGatheringState==="complete")return r();
 const f=()=>{if(c.iceGatheringState==="complete"){c.removeEventListener("icegatheringstatechange",f);r()}};c.addEventListener("icegatheringstatechange",f);setTimeout(r,2500)});

const send=o=>{try{dc&&dc.readyState==="open"&&dc.send(JSON.stringify(o))}catch(e){}};

function mkpc(){pc=new RTCPeerConnection(ICE);pc.onconnectionstatechange=()=>{const s=pc.connectionState;
 if(s==="connected")st.conn="open";
 else if(s==="failed"){st.conn="failed";st.msg="เชื่อมต่อไม่สำเร็จ — ลองสลับเครือข่าย (เช่น ใช้เน็ตมือถือ)"}
 else if((s==="disconnected"||s==="closed")&&p2p)st.conn="lost";R()}}
function wire(ch){dc=ch;ch.onopen=enterP2P;
 ch.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(x){return}
  if(m.t==="s"){opp=m.d;enterP2P();R()}

 ch.onclose=()=>{if(p2p){st.conn="lost";R()}}}
function enterP2P(){if(p2p)return;p2p=true;bot=false;newMatch();mine=fromDeck();st.conn="open";R();save()}
function checkRm(){if(st.rm&&st.orm){newMatch();mine=fromDeck();opp=null;save();R()}}

 catch(e){st.conn="";st.msg="โค้ดไม่ถูกต้อง: "+e.message}st.busy=0;R()}

 if(st.tab==="deck"){const tot=Object.values(S.inv).reduce((s,n)=>s+n,0),have=Object.keys(S.inv).length;
  const ec=EK.map(e=>[e,S.deck.filter(i=>C[i].e===e).length]).filter(x=>x[1]).map(([e,n])=>`${EM[e]}×${n}`).join(" "),ap=S.deck.length?(S.deck.reduce((t,i)=>t+C[i].p,0)/S.deck.length).toFixed(1):"-";
  h+=`<div class="box"><b>เด็ค ${S.deck.length}/10</b> · งบ <b>${dcost(S.deck)}/${BUD}</b> · พลังเฉลี่ย ${ap}<br><small>${ec||"ยังไม่มีการ์ด"} · (ธรรมดา=1 หายาก=2 ตำนาน=3 · ซ้ำไม่เกิน 3 ใบ) แตะการ์ดในเด็คเพื่อเอาออก</small><div class="grid" style="margin:8px 0">${[...Array(10)].map((_,i)=>S.deck[i]!==undefined?cardH(S.deck[i],"add",0,0,'data-rm="1"'):'<div class="slot">+</div>').join("")}</div>
  <div class="row"><button data-act="auto">⚡ เติมเด็คแรงสุด</button><button data-act="clr">ล้างเด็ค</button></div></div>
  <div class="box"><b>สมุดสะสม ${have}/${C.length}</b> <small>(${tot} ใบ) แตะเพื่อเพิ่มเข้าเด็ค</small>
  <div class="row chips" style="margin:8px 0"><button data-flt="all" class="${st.flt==="all"?"on":""}">ทั้งหมด</button>${EK.map(e=>`<button data-flt="${e}" class="${st.flt===e?"on":""}">${EM[e]}</button>`).join("")}</div>
  <div class="grid">${C.filter(c=>st.flt==="all"||c.e===st.flt).map(c=>S.inv[c.id]?cardH(c.id,"add"+(canAdd(c.id)?"":" dim"),S.inv[c.id]):'<div class="card dim"><div class="em">?</div><b>#'+(c.id+1)+"</b></div>").join("")}</div></div>`}
 return h}
function R(){
 const a=$("#app");let h=topH();
 if(st.tab==="game"){h+=gameH();st.dealt=true}else h+=tabH();
 a.innerHTML=h;
 if(st.tab==="pack")st.packAnim=false;
 st.coinBump=0;
 if(st.msg){toast(st.msg);st.msg=""}}
// ---- อีเวนต์
let ct=null;
document.addEventListener("input",e=>{const i=e.target.id;if(i==="nm")st.nm=e.target.value;
 if(i==="cin"){st.cin=e.target.value;clearTimeout(ct);ct=setTimeout(()=>{if(st.cin.length>80){
  if(st.p2p==="host"&&pc&&st.conn!=="connecting"&&st.conn!=="open")p2pGo();else if(st.p2p==="guest"&&!st.out)p2pAns()}},400)}});
document.addEventListener("click",e=>{
 const t=e.target.closest("[data-tab],[data-act],[data-flt],[data-help],.card");if(!t)return;
 const act=t.dataset.act;
 if(act==="snd"){S.snd=!S.snd;sv();if(S.snd)snd("pick");return R()}
 if(act==="seen"){S.seen=true;st.tut=false;sv();return R()}
 if(act==="tut"){st.tut=!st.tut;st.tab==="game"?0:st.tab="play";return R()}
 if(t.dataset.tab){st.tab=t.dataset.tab;return R()}
 if(t.dataset.flt){st.flt=t.dataset.flt;return R()}
 if(t.dataset.help){st.help=st.help===t.dataset.help?"":t.dataset.help;return R()}
 if(act==="home")return location.reload();
 if(act==="copylink")return copy(link());
 if(act==="copycode")return copy(st.out);
 if(st.tab==="game"){
  if(act==="closeview"){st.view=-1;return R()}
  if(act==="again"){if(bot)startBot();else{st.rm=true;send({t:"rm"});toast("รอเพื่อนกดเล่นอีกครั้ง…");checkRm()}return}
  if(t.classList.contains("pick")&&t.dataset.i!==undefined){st.sel=+t.dataset.i;snd("pick");return R()}
  if(t.classList.contains("card")&&t.dataset.id!==undefined){st.view=+t.dataset.id;return R()}
  if(act==="unsel"){st.sel=-1;return R()}
  if(act==="play"&&st.sel>=0){mine.picks.push(mine.hand.splice(st.sel,1)[0]);st.sel=-1;snd("play");save();return R()}
  return}
 if(act==="bot")return startBot();
 if(act==="p2phost")return p2pHost();
 if(act==="p2pguest"){st.p2p="guest";st.out="";st.cin="";st.conn="";return R()}
 if(act==="p2pcancel")return p2pCancel();
 if(act==="open"&&S.coins>=PACK){const had=new Set(Object.keys(S.inv));S.coins-=PACK;st.pack=openPack();st.packAnim=true;st.newIds=st.pack.filter(i=>!had.has(String(i)));st.coinBump=1;snd("coin");
  st.pack.forEach((id,k)=>setTimeout(()=>snd(C[id].r==="L"?"legend":C[id].r==="R"?"rare":"flip"),250+k*180));return R()}
 if(act==="usepack"){S.deck=build(st.pack);sv();const same=[...S.deck].sort().join()===[...st.pack].sort().join();st.msg=same?"✅ ตั้งเป็นเด็คแล้ว พร้อมเล่น!":"✅ ใช้การ์ดจากซองเป็นหลัก แต่ปรับให้ถูกกฎ (งบ 18 · ซ้ำไม่เกิน 3) แล้ว";st.tab="play";return R()}
 if(act==="clr"){S.deck=[];sv();return R()}
 if(act==="auto"){S.deck=build([]);sv();return R()}
 if(st.tab==="deck"&&t.classList.contains("card")&&t.dataset.id!==undefined){
  const id=+t.dataset.id;
  if(t.dataset.rm){const k=S.deck.indexOf(id);if(k>=0)S.deck.splice(k,1)}
  else if(t.classList.contains("add")){if(canAdd(id))S.deck.push(id);else st.msg="เพิ่มไม่ได้: เด็คเต็ม · ซ้ำเกิน 3 ใบ · หรือเกินงบเด็ค"}
  sv();R()}
});
R();
const hm=location.hash.match(/^#j=(.+)/);
if(hm){st.p2p="guest";st.cin=hm[1];R();p2pAns()}
</script></body></html>
