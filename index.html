const dcost=d=>d.reduce((t,i)=>t+C[i].c,0);
const canAdd=(id,d=S.deck)=>d.length<10&&d.filter(x=>x===id).length<Math.min(MAXC,S.inv[id]||0)&&(C[id].r!=="L"||d.filter(x=>C[x].r==="L").length<MAXL)&&dcost(d)+C[id].c+(9-d.length)*minc()<=BUD;
const deckOk=()=>S.deck.length===10&&dcost(S.deck)<=BUD&&S.deck.filter(i=>C[i].r==="L").length<=MAXL&&S.deck.every(i=>dcnt(i)<=Math.min(MAXC,S.inv[i]||0));
function build(pref){const pool=[];Object.entries(S.inv).forEach(([i,n])=>{for(let k=0;k<n;k++)pool.push(+i)});
 const key=i=>(pref.includes(i)?1000:0)+C[i].p,d=[];
 pool.sort((a,b)=>key(b)-key(a)||b-a).forEach(i=>{if(canAdd(i,d))d.push(i)});return d}
// เด็คเริ่มต้นสำหรับผู้เล่นใหม่: ชุดที่จูนไว้แล้ว (เต็มงบ ไม่มีตำนาน หลายธาตุ)
const STARTERS=[[36, 40, 42, 16, 61, 43, 68, 73, 19, 32], [56, 47, 94, 23, 95, 15, 71, 73, 27, 10], [64, 16, 84, 80, 58, 71, 49, 20, 7, 33], [83, 40, 32, 17, 42, 95, 81, 71, 49, 70], [28, 92, 95, 32, 8, 33, 9, 76, 36, 97], [83, 79, 58, 36, 20, 73, 27, 2, 71, 15]];
function starter(){if(STARTERS.length)return rnd(STARTERS).slice();let d,n=0;do{d=shuf(C.filter(c=>c.r!=="L")).slice(0,10).map(c=>c.id);n++}while((dcost(d)>BUD||dcost(d)<BUD-3)&&n<5000);
 return dcost(d)<=BUD?d:C.filter(c=>c.r!=="L").sort((a,b)=>a.c-b.c).slice(0,10).map(c=>c.id)}
if(!Object.keys(S.inv).length){const d=starter();d.forEach(i=>S.inv[i]=(S.inv[i]||0)+1);S.deck=d;sv();st.msg="🎁 ได้การ์ดเริ่มต้น 10 ใบ"}
else if(!deckOk()){S.deck=build([]);sv()}

let AC=null;
function snd(k){if(!S.snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();
 const T={pick:[[660,.06]],play:[[440,.08],[660,.1]],flip:[[520,.07]],win:[[523,.1],[659,.1],[784,.2]],lose:[[330,.12],[247,.22]],rare:[[660,.08],[880,.12]],legend:[[523,.08],[659,.08],[784,.08],[1047,.28]],coin:[[988,.06],[1319,.12]]}[k]||[];
 let t=AC.currentTime;T.forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type="triangle";o.frequency.value=f;g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);t+=d*.9})}catch(e){}}
function toast(t){const e=$("#toast");if(!e)return;e.textContent=t;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),2600)}
function fb(t){const x=document.createElement("textarea");x.value=t;document.body.appendChild(x);x.select();try{document.execCommand("copy");toast("คัดลอกแล้ว ✅")}catch(e){toast("คัดลอกไม่ได้")}x.remove()}

function cardH(id,x="",n=0,d=0,ex="",pw=null){const c=C[id];return `<div class="card ${c.r} ${x}" style="background:${TINT[c.e]};--d:${d}s" data-id="${id}" ${ex} title="${c.n}"><i class="p ${pw!==null&&pw>c.p?"up":""}">${pw??c.p}</i>${c.a?`<i class="ab">${AB[c.a][0]}</i>`:""}<div class="em">${c.m}</div><b>${EM[c.e]}${c.n}</b><i class="cs">◆${c.c}</i>${n?`<span class="n">×${n}</span>`:""}</div>`}
function info(id){const c=C[id];return `<b>${c.m} ${c.n}</b> ${EM[c.e]}${EN[c.e]} · พลัง ${c.p} · ◆${c.c}${c.a?`<br>${AB[c.a][0]} ${AB[c.a][1]}: ${AB[c.a][2]}`:""}<br><small>ชนะ ${BEAT[c.e].map(x=>EM[x]).join("")} · แพ้ ${EK.filter(k=>BEAT[k].includes(c.e)).map(x=>EM[x]).join("")}</small>`}

let bot=false,opp=null,mine=null,paid=false,pc=null,dc=null,p2p=false;
function newMatch(){paid=false;st.flipDone=0;st.dealt=false;st.confDone=0;st.sel=-1;st.rm=false;st.orm=false;st.help=false;st.view=-1;st.tab="game"}
function fromDeck(){const d=shuf(S.deck);return{name:st.nm.trim()||"ผู้เล่น",hand:d.slice(0,5),deck:d.slice(5),picks:[],drawn:[],seed:Math.floor(Math.random()*2147483647)}}
function settle(P,Q){let ch=false;const rs=rounds(P,Q);
 rs.forEach((r,i)=>{if(!P.drawn.includes(i)){P.drawn.push(i);ch=true;
  if(r.w>0){let n=r.ea==="l"?2:1;while(n--&&P.deck.length)P.hand.push(P.deck.shift())}}});return ch}
const botDeck=()=>starter();
function startBot(){newMatch();bot=true;p2p=false;mine=fromDeck();const d=botDeck();
 opp={name:"บอทมอน 🤖",hand:d.slice(0,5),deck:d.slice(5),picks:[],drawn:[],seed:Math.floor(Math.random()*2147483647)};R()}
function botTurn(){if(opp.picks.length>=mine.picks.length)return;
 setTimeout(()=>{if(opp.picks.length>=mine.picks.length)return;
  const h=opp.hand,ar=arenas(mine,opp)[opp.picks.length],w=h.map(i=>C[i].p+(C[i].e===ar?ARB:0)+Math.random()*2.5),k=w.indexOf(Math.max(...w));
  opp.picks.push(h.splice(k,1)[0]);settle(opp,mine);R()},900)}
// ---- เล่นกับเพื่อน (WebRTC แลกโค้ด / ลิงก์เชิญ)
const ICE={iceServers:[{urls:"stun:stun.l.google.com:19302"},{urls:"stun:stun.cloudflare.com:3478"}]};
const b64=u=>btoa(String.fromCharCode(...u)).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const ub64=s=>Uint8Array.from(atob(s.replace(/-/g,"+").replace(/_/g,"/")),c=>c.charCodeAt(0));
async function zip(str){const u=new TextEncoder().encode(str);
 if(window.CompressionStream)return "z"+b64(new Uint8Array(await new Response(new Blob([u]).stream().pipeThrough(new CompressionStream("deflate-raw"))).arrayBuffer()));
 return "p"+b64(u)}
async function unzip(c){c=c.trim();if(c.includes("j="))c=c.split("j=").pop();c=c.replace(/\s/g,"");const u=ub64(c.slice(1));
 if(c[0]==="z")return new TextDecoder().decode(await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer());
 return new TextDecoder().decode(u)}
const gathered=c=>new Promise(r=>{if(c.iceGatheringState==="complete")return r();
 const f=()=>{if(c.iceGatheringState==="complete"){c.removeEventListener("icegatheringstatechange",f);r()}};c.addEventListener("icegatheringstatechange",f);setTimeout(r,2500)});
const link=()=>location.href.split("#")[0]+"#j="+st.out;
const send=o=>{try{dc&&dc.readyState==="open"&&dc.send(JSON.stringify(o))}catch(e){}};
const save=()=>bot?botTurn():p2p?send({t:"s",d:mine}):0;
function mkpc(){pc=new RTCPeerConnection(ICE);pc.onconnectionstatechange=()=>{const s=pc.connectionState;
 if(s==="connected")st.conn="open";
 else if(s==="failed"){st.conn="failed";st.msg="เชื่อมต่อไม่ได้ ลองสลับเครือข่าย"}
 else if((s==="disconnected"||s==="closed")&&p2p)st.conn="lost";R()}}
function wire(ch){dc=ch;ch.onopen=enterP2P;
 ch.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(x){return}
  if(m.t==="s"){opp=m.d;enterP2P();R()}
  if(m.t==="rm"){st.orm=true;checkRm()}};
 ch.onclose=()=>{if(p2p){st.conn="lost";R()}}}
function enterP2P(){if(p2p)return;p2p=true;bot=false;newMatch();mine=fromDeck();st.conn="open";R();save()}
function checkRm(){if(st.rm&&st.orm){newMatch();mine=fromDeck();opp=null;save();R()}}
async function p2pHost(){st.p2p="host";st.out="";st.cin="";st.conn="gen";R();
 try{mkpc();wire(pc.createDataChannel("g"));await pc.setLocalDescription(await pc.createOffer());await gathered(pc);st.out=await zip(JSON.stringify(pc.localDescription));st.conn="wait"}
 catch(e){st.conn="failed";st.msg="สร้างโค้ดไม่ได้"}R()}
async function p2pAns(){if(st.busy)return;st.busy=1;st.conn="gen";R();
 try{const o=JSON.parse(await unzip(st.cin));mkpc();pc.ondatachannel=e=>wire(e.channel);await pc.setRemoteDescription(o);await pc.setLocalDescription(await pc.createAnswer());await gathered(pc);st.out=await zip(JSON.stringify(pc.localDescription));st.conn="wait"}
 catch(e){st.conn="";st.msg="โค้ดไม่ถูกต้อง"}st.busy=0;R()}
async function p2pGo(){if(st.busy||!pc)return;st.busy=1;
 try{await pc.setRemoteDescription(JSON.parse(await unzip(st.cin)));st.conn="connecting"}catch(e){st.msg="โค้ดไม่ถูกต้อง"}st.busy=0;R()}
function p2pCancel(){try{pc&&pc.close()}catch(e){}pc=dc=null;st.p2p="";st.out="";st.cin="";st.conn="";st.busy=0;R()}
const ST={gen:"⏳ กำลังสร้าง…",wait:"⌛ รอเพื่อน…",connecting:"🔌 กำลังเชื่อมต่อ…",open:"✅ เชื่อมต่อแล้ว",failed:"❌ เชื่อมต่อไม่ได้",lost:"⚠️ หลุด"};

function p2pH(ok){let h=`<div class="box"><b>👥 เล่นกับเพื่อน</b>`;
 if(!st.p2p)h+=`<div class="row" style="margin-top:8px"><button data-act="p2phost" ${ok?"":"disabled"}>🏠 สร้างห้อง</button><button data-act="p2pguest" ${ok?"":"disabled"}>🙋 เข้าห้อง</button></div>`;
 else{const s=st.conn?`<p>${ST[st.conn]||""}</p>`:"";
  if(st.p2p==="host")h+=`<ol class="steps"><li>ส่งลิงก์ให้เพื่อน${st.out?`${ta("out",link(),1)}<div class="row"><button class="sm" data-act="copylink">📋 ลิงก์</button><button class="sm" data-act="copycode">📋 โค้ด</button></div>`:" …"}</li><li>วางโค้ดที่เพื่อนตอบกลับ${ta("cin",st.cin)}</li></ol>${s}`;
  else h+=`<ol class="steps">${st.out?"":`<li>วางลิงก์/โค้ดจากเจ้าของห้อง${ta("cin",st.cin)}</li>`}${st.out?`<li>ส่งโค้ดนี้กลับ${ta("out",st.out,1)}<button class="sm" data-act="copycode">📋 โค้ด</button></li>`:""}</ol>${s}`;
  h+=`<button class="sm" data-act="p2pcancel">ยกเลิก</button>`}
 return h+"</div>"}

const POS=[[0,1],[0,2],[1,2],[2,2],[2,1],[2,0],[1,0],[0,0]];
function wheelH(){const s=st.wv||"fire",cells=Array(9).fill("");
 RING.forEach((e,i)=>{const [r,c]=POS[i],cls=e===s?"self":BEAT[s].includes(e)?"w":BEAT[e].includes(s)?"l":"t";cells[r*3+c]=`<button class="wc ${cls}" data-wv="${e}">${EM[e]}<small>${EN[e]}</small></button>`});
 cells[4]=`<div class="wmid"><small>${EM[s]} ชนะ ${BEAT[s].map(x=>EM[x]).join("")}<br>${WHY[s]}</small></div>`;
 return `<div class="wheel">${cells.join("")}</div><small>เรียงตามเข็มนาฬิกา: ชนะ 3 ตัวถัดไป · แพ้ 3 ตัวก่อนหน้า · ตรงข้ามเสมอ</small>`}

 return `<div class="box pop"><b>ธาตุชนะ +${2} · พื้นที่ตรงธาตุ +${ARB}</b>${wheelH()}<div class="lg" style="margin-top:8px">${Object.values(AB).map(v=>`<span>${v[0]} <b>${v[1]}</b> ${v[2]}</span>`).join("")}</div></div>`}

const confetti=()=>`<div class="confetti">${[...Array(18)].map((_,i)=>`<i style="left:${(i*37)%100}%;animation-delay:${(i%6)*.25}s">${["🎉","⭐","🍓","✨","🍮","💖"][i%6]}</i>`).join("")}</div>`;
const handH=(can,ar)=>`<div class="hand">${mine.hand.map((id,i)=>{const c=C[id],bo=ar&&c.e===ar?ARB:0;return cardH(id,(can?"pick ":"")+(i===st.sel?"sel ":"")+(st.dealt?"":"deal"),0,i*.07,`data-i="${i}"`,c.p+bo)}).join("")}</div>`;
function sumH(r,a,b,ar){const part=(c,bn,ax,g,e)=>`${c.m}${c.p}${bn?`▲${bn}`:""}${ax?`${AR[ar][0]}${ax}`:""}${g?`${AB[e][0]}${g}`:""}`;
 const ic=[r.ea==="n"||r.eb==="n"?"🌀":"",(a.a&&r.ea!==a.a)||(b.a&&r.eb!==b.a)?"🔇":"",r.x===r.y&&r.w?"🎯":"",r.w>0&&r.ea==="l"?"🍀":"",r.w>0&&r.ea==="r"?"💰":""].join("");
 return `${part(a,r.bx,r.ax,r.gx,r.ea)} = <b>${r.x}</b> ⚔ ${part(b,r.by,r.ay,r.gy,r.eb)} = <b>${r.y}</b> ${r.w>0?"🎉":r.w<0?"😢":"🤝"} ${ic}`}
function gameH(){
 if(!opp)return `<div class="box big">⏳</div>`;
 if(settle(mine,opp))save();
 const rs=rounds(mine,opp),done=rs.length,ar=arenas(mine,opp);let me=0,op=0,rich=0;
 rs.forEach(r=>{if(r.w>0){me++;if(r.ea==="r")rich++}else if(r.w<0)op++});
 const over=me>=3||op>=3||done>=5,picked=mine.picks.length>done,fresh=st.flipDone<done;
 const pips=n=>"●".repeat(Math.min(n,3))+"○".repeat(3-Math.min(n,3));
 let h=`${!bot&&st.conn==="lost"&&!over?`<div class="box">⚠️ เพื่อนหลุด <button class="sm" data-act="home">ออก</button></div>`:""}<div class="bar"><div class="pl"><b>${esc(mine.name)}</b><br><span class="pips">${pips(me)}</span></div><div class="mid">${Math.min(done+1,5)}/5</div><div class="pl r"><b>${esc(opp.name)}</b><br><span class="pips">${pips(op)}</span></div></div><div class="row chips" style="margin:0 0 6px"><button class="sm ${st.help?"on":""}" data-act="help">❓</button></div>${helpH()}<div class="field">`;
 for(let i=0;i<5;i++){let o,m,r_="";
  if(i<done){const r=rs[i],nw=i===done-1&&fresh,cl=w=>(nw?"flip ":"")+(w>0?"win":w<0?"lose":"");
   o=cardH(opp.picks[i],cl(-r.w));m=cardH(mine.picks[i],cl(r.w));r_=r.w>0?"✅":r.w<0?"❌":"🤝"}
  else if(i===done&&!over){o=opp.picks.length>i?'<div class="cback">🂠</div>':'<div class="slot now">…</div>';
   m=picked?cardH(mine.picks[i],"sel"):st.sel>=0?cardH(mine.hand[st.sel],"sel"):'<div class="slot now">ลง</div>'}
  else o=m='<div class="slot">·</div>';
  h+=`<div class="col"><div class="ar ${i===done&&!over?"now":""}" title="${AR[ar[i]][1]}">${AR[ar[i]][0]}<small>${EM[ar[i]]}</small></div>${o}<div class="res">${r_}</div>${m}</div>`}
 h+="</div>";
 if(done){const r=rs[done-1];if(fresh){st.flipDone=done;snd(r.w>0?"win":r.w<0?"lose":"flip")}
  h+=`<div class="box" style="margin-top:10px">${sumH(r,C[mine.picks[done-1]],C[opp.picks[done-1]],ar[done-1])}</div>`}
 if(over){let g=me>op?40:me<op?20:30;g+=rich*10;
  if(!paid){paid=true;S.coins+=g;sv();st.coinBump=1;snd(me>op?"win":me<op?"lose":"coin")}
  let cf="";if(me>op&&!st.confDone){st.confDone=1;cf=confetti()}
  h+=`${cf}<div class="box big pop"><b style="font-size:24px">${me>op?"🏆":me<op?"💔":"🤝"}</b><div class="reward">🪙 +${g}</div><div class="row" style="justify-content:center;margin-top:8px"><button class="go" data-act="again">🔁</button><button data-act="home">🏠</button></div></div>`}
 else{const cur=ar[done];
  h+=`<div class="box arena pop">${AR[cur][0]} <b>${AR[cur][1]}</b> · ${EM[cur]}${EN[cur]} +${ARB}</div>`;
  h+=handH(!picked,cur)+`<small>🂠 ${mine.deck.length}</small>`;
  if(picked)h+=`<div class="big">✅ รอ…</div>`;
  else if(st.sel>=0)h+=`<div class="cbar"><div>${info(mine.hand[st.sel])}</div><div class="row"><button class="go" data-act="play">✔ ลงการ์ด</button><button data-act="unsel">✖</button></div></div>`}
 return h}

  <div class="row"><button data-act="auto">⚡ อัตโนมัติ</button><button data-act="clr">ล้าง</button></div></div>
  <div class="box"><b>📚 ${have}/${C.length}</b> <small>(${tot})</small>
  <div class="row chips" style="margin:8px 0"><button data-flt="all" class="${st.flt==="all"?"on":""}">ทั้งหมด</button>${EK.map(e=>`<button data-flt="${e}" class="${st.flt===e?"on":""}">${EM[e]}</button>`).join("")}</div>
  <div class="grid">${C.filter(c=>st.flt==="all"||c.e===st.flt).map(c=>S.inv[c.id]?cardH(c.id,"add"+(canAdd(c.id)?"":" dim"),S.inv[c.id]):'<div class="card dim"><div class="em">?</div><b>#'+(c.id+1)+"</b></div>").join("")}</div></div>`}

document.addEventListener("click",e=>{
 const t=e.target.closest("[data-tab],[data-act],[data-flt],[data-wv],.card");if(!t)return;
 const act=t.dataset.act;
 if(act==="snd"){S.snd=!S.snd;sv();if(S.snd)snd("pick");return R()}
 if(act==="help"){st.help=!st.help;return R()}
 if(t.dataset.tab){st.tab=t.dataset.tab;return R()}
 if(t.dataset.flt){st.flt=t.dataset.flt;return R()}
 if(t.dataset.wv){st.wv=t.dataset.wv;return R()}
 if(act==="home")return location.reload();
 if(act==="copylink")return copy(link());
 if(act==="copycode")return copy(st.out);
 if(st.tab==="game"){
  if(act==="again"){if(bot)startBot();else{st.rm=true;send({t:"rm"});toast("รอเพื่อน…");checkRm()}return}
  if(t.classList.contains("pick")&&t.dataset.i!==undefined){st.sel=+t.dataset.i;snd("pick");return R()}
  if(act==="unsel"){st.sel=-1;return R()}
  if(act==="play"&&st.sel>=0){mine.picks.push(mine.hand.splice(st.sel,1)[0]);st.sel=-1;snd("play");save();return R()}
  return}
 if(act==="bot")return startBot();
 if(act==="p2phost")return p2pHost();
 if(act==="p2pguest"){st.p2p="guest";st.out="";st.cin="";st.conn="";return R()}
 if(act==="p2pcancel")return p2pCancel();
 if(act==="open"&&S.coins>=PACK){const had=new Set(Object.keys(S.inv));S.coins-=PACK;st.pack=openPack();st.packAnim=true;st.newIds=st.pack.filter(i=>!had.has(String(i)));st.coinBump=1;snd("coin");
  st.pack.forEach((id,k)=>setTimeout(()=>snd(C[id].r==="L"?"legend":C[id].r==="R"?"rare":"flip"),250+k*180));return R()}
 if(act==="usepack"){S.deck=build(st.pack);sv();st.msg=S.deck.length===10?"✅ ตั้งเด็คแล้ว":"⚠️ ปรับเด็คต่อ";st.tab="play";return R()}
 if(act==="clr"){S.deck=[];sv();return R()}
 if(act==="auto"){S.deck=build([]);sv();return R()}
 if(st.tab==="deck"&&t.classList.contains("card")&&t.dataset.id!==undefined){
  const id=+t.dataset.id;
  if(t.dataset.rm){const k=S.deck.indexOf(id);if(k>=0)S.deck.splice(k,1)}
  else if(t.classList.contains("add")){if(canAdd(id))S.deck.push(id);else st.msg="เพิ่มไม่ได้ (เต็ม/งบ/ซ้ำ/ตำนาน)"}
  sv();R()}
});
R();
const hm=location.hash.match(/^#j=(.+)/);
if(hm){st.p2p="guest";st.cin=hm[1];R();p2pAns()}
</script></body></html>
